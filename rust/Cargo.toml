[package]
name = "pipek1"
version = "0.1.0"
edition = "2021"
authors = ["bootlace-dev <bootlace-dev@users.noreply.github.com>"]
description = "Pure stateless UNIX stream filter for BIP-340 Schnorr release signing and authenticated secp256k1 encryption"
license = "MIT"

[dependencies]
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
k256 = { version = "0.13", features = ["schnorr", "ecdsa", "ecdh", "arithmetic"] }
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
bech32 = "0.11"
bip39 = "2.1"
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc"] }
base64 = "0.22"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"

[[bin]]
name = "pipek1"
path = "src/main.rs"
